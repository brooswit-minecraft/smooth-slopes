name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Test release scripts
        run: python3 -m unittest discover -s scripts

      - name: Check the mod does not require a newer NeoForge than the pack runs
        run: python3 scripts/check_neoforge_floor.py

      - name: Build and test
        run: ./gradlew build --no-daemon

      # MINECRAFT-500 / mirrors Dynamic Terrain's own CoinstalledGameTests for the MINECRAFT-499
      # split: coinstalled runtime proof, not just compile-time, that this mod actually boots
      # together with Layered Slopes. Gradle reports BUILD SUCCESSFUL even when the GameTest
      # server fails to start or ran zero tests, so check_gametest_count.py fails closed unless
      # the exact expected count of named tests actually ran and passed.
      - name: Run GameTests (coinstalled with Layered Slopes)
        run: |
          set -o pipefail
          ./gradlew runGameTestServer --no-daemon 2>&1 | tee gametest.log
          python3 scripts/check_gametest_count.py gametest.log

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: smooth-slopes
          path: build/libs/*.jar
          if-no-files-found: error

  release-gate:
    uses: brooswit-factory/release-gate/.github/workflows/gate.yml@v1
    with:
      gated-paths: '["^src/"]'
      version-file: 'gradle.properties'

  # MINECRAFT-500 / Jira review 52702/52703/52752: the coinstalled GameTest above proves this mod
  # boots with Layered Slopes, but not that it actually smooths generated terrain under
  # FreeTerraForged's own noise settings. This generates FreeTerraForged's real default preset as
  # an applied datapack (FreeTerraForgedPresetFixture, headless, no GUI), then boots a real
  # dedicated server twice (worldgenSmoothing on/off, same seed, same datapack) and checks over
  # RCON for a layered block -- the one thing that can only exist if smoothing actually ran.
  freeterraforged-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Generate FreeTerraForged's default preset as an applied datapack
        run: ./gradlew runFtfPresetData --no-daemon

      - name: Run FreeTerraForged acceptance (enabled vs disabled, same seed)
        run: python3 tools/freeterraforged-acceptance/ftf_acceptance.py . build/ftf-preset-data/freeterraforged_default_preset

      - name: Preserve FreeTerraForged acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freeterraforged-acceptance
          path: |
            ftf-acceptance-*.log
            ftf-acceptance-result.json
          if-no-files-found: warn
