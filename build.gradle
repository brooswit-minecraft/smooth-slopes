plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

group = mod_group_id

// Single source of truth for the shipped version is `version=` in
// gradle.properties, the file the release gate reads. A release workflow may
// override it with `-Pmod_version=<version>`.
def modVersion = (findProperty("mod_version") ?: project.version) as String
version = modVersion

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("src/generated/**/.cache")
}

// Wroosbit review 52775: the MINECRAFT-500 FreeTerraForged acceptance fixture (and the
// FreeTerraForged dependency it compiles against) must never reach the shipped Smooth Slopes jar
// or any other run's classpath. A separate sourceSet -- not part of main's own output, and with
// no compile-time dependency in either direction (see FreeTerraForgedPresetFixture's own class
// doc for why it's looked up reflectively from main instead of being its own NeoForge mod) -- is
// what makes that structurally true rather than merely intended.
sourceSets {
    ftfFixture { }
}

repositories {
    // layered-slopes is not on a maven repository; fetched from its GitHub release, pinned by
    // version and verified by sha512, the same pattern dynamic-terrain and dynamic-vehicles use
    // for their own required cross-mod dependencies.
    mavenCentral()
}

// layered-slopes provides the LayeredBlock/LayeredSlopesMod classes SmoothSurfaceFeature consumes
// (the registered layered-block family and LAYERED_SNOW_BLOCK). Required, not optional: this mod
// cannot smooth anything without the real registered layered blocks, so this goes on compileOnly
// AND runtimeOnly, and is declared "required" in neoforge.mods.toml.
def layeredSlopesJar = layout.buildDirectory.file("layeredslopes/layeredslopes-${project.layeredslopes_version}.jar")
def layeredSlopesVersion = project.layeredslopes_version
def layeredSlopesSha512 = project.layeredslopes_sha512
tasks.register("downloadLayeredSlopes") {
    outputs.file(layeredSlopesJar)
    doLast {
        def target = layeredSlopesJar.get().asFile
        target.parentFile.mkdirs()
        def url = "https://github.com/brooswit-minecraft/layered-slopes/releases/download/v${layeredSlopesVersion}/layeredslopes-${layeredSlopesVersion}.jar"
        new URL(url).withInputStream { input -> target.withOutputStream { it << input } }
        def digest = java.security.MessageDigest.getInstance("SHA-512")
        def actual = digest.digest(target.bytes).encodeHex().toString()
        if (actual != layeredSlopesSha512) {
            target.delete()
            throw new GradleException("layered-slopes ${layeredSlopesVersion} sha512 mismatch: ${actual}")
        }
    }
}

// FreeTerraForged: NOT a dependency of this mod (not in neoforge.mods.toml, never on main's
// classpath at all) -- a dev/CI-only tool for the MINECRAFT-500 acceptance evidence in
// tools/freeterraforged-acceptance/, which needs its real jar only on the dedicated
// ftfPresetData run's classpath (see the dependencies{} block below) to call its public
// Presets/DataGenUtil API and generate its default preset's actual patch registries as a real
// datapack (see FreeTerraForgedPresetFixture). Pinned by version and verified by sha512, same
// download-and-verify pattern as layered-slopes above.
// Captured as plain values at configuration time: the configuration cache forbids any
// project.*/bare-property access inside doLast{} at execution time (confirmed live by this exact
// failure: "Could not get unknown property 'minecraft_version'" when it was referenced directly
// inside doLast{} below -- the same class of bug dynamic-terrain's own downloadLayeredSlopes hit
// and fixed for the same reason).
def freeTerraForgedMinecraftVersion = project.minecraft_version
def freeTerraForgedJar = layout.buildDirectory.file("freeterraforged/freeterraforged-${project.freeterraforged_version}-neoforge-${freeTerraForgedMinecraftVersion}.jar")
def freeTerraForgedVersion = project.freeterraforged_version
def freeTerraForgedSha512 = project.freeterraforged_sha512
tasks.register("downloadFreeTerraForged") {
    outputs.file(freeTerraForgedJar)
    doLast {
        def target = freeTerraForgedJar.get().asFile
        target.parentFile.mkdirs()
        def url = "https://cdn.modrinth.com/data/4ZFPRF02/versions/gU4J7GiI/freeterraforged-${freeTerraForgedVersion}-neoforge-${freeTerraForgedMinecraftVersion}.jar"
        new URL(url).withInputStream { input -> target.withOutputStream { it << input } }
        def digest = java.security.MessageDigest.getInstance("SHA-512")
        def actual = digest.digest(target.bytes).encodeHex().toString()
        if (actual != freeTerraForgedSha512) {
            target.delete()
            throw new GradleException("freeterraforged ${freeTerraForgedVersion} sha512 mismatch: ${actual}")
        }
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // Declared before runs{} below: each run's loadedMods (set just below) references these by
    // name, and that reference must resolve against an already-populated container.
    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    runs {
        client {
            client()
            if (project.hasProperty('quickPlay')) {
                programArguments.addAll('--quickPlaySingleplayer', project.property('quickPlay'))
            }
            if (project.hasProperty('quickPlayMp')) {
                programArguments.addAll('--quickPlayMultiplayer', project.property('quickPlayMp'))
            }
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            loadedMods = [mods.getByName("${mod_id}")]
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            loadedMods = [mods.getByName("${mod_id}")]
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            loadedMods = [mods.getByName("${mod_id}")]
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
            loadedMods = [mods.getByName("${mod_id}")]
        }

        // MINECRAFT-500 acceptance: a SEPARATE data run, output to build/ (never src/generated/
        // resources, so this never ships in the mod jar). loadedMods stays just the real mod --
        // FreeTerraForgedPresetFixture is not a NeoForge mod of its own (see its own class doc:
        // three different attempts at making it one each failed in a different way). Its compiled
        // output and FreeTerraForged's own jar are added to ONLY this run's
        // additionalRuntimeClasspathConfiguration below, purely so plain JVM classloading
        // (SmoothSlopesMod's reflective Class.forName lookup) can find them -- not NeoForge's own
        // mod-file discovery, which is exactly the mechanism that kept failing.
        //
        // --mod stays the REAL mod id, not a synthetic marker: confirmed live that
        // DatagenModLoader only adds a container's DataGenerator to the actually-run set when
        // dataGeneratorConfig.getMods().contains(container.getModId()) -- a synthetic --mod value
        // here left every registered provider created-but-never-run, with no error at all, which
        // is exactly what the first real CI attempt showed. The system property is what tells
        // this run apart from the ordinary `data` run above.
        ftfPresetData {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('build/ftf-preset-data/').getAbsolutePath()
            systemProperty 'smoothslopes.ftfPresetFixture', 'true'
            loadedMods = [mods.getByName("${mod_id}")]
        }

        // MINECRAFT-500 / Wroosbit review 52775 finding 2+3: boots Dynamic Terrain + Layered
        // Slopes + Smooth Slopes together, at their exact coordinated PR heads, through a real
        // dedicated server (not three separate coinstalled-pairs tests). Dynamic Terrain's own
        // built jar is supplied via the dtJarPath project property (tools/paired-acceptance/
        // paired_acceptance.py passes it after building Dynamic Terrain's own checkout), added to
        // this run's own additionalRuntimeClasspathConfiguration in dependencies{} below -- the
        // same mechanism layered-slopes' jar already relies on to be discovered as a real mod.
        pairedServer {
            server()
            programArgument '--nogui'
            loadedMods = [mods.getByName("${mod_id}")]
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }
}

dependencies {
    compileOnly files(layeredSlopesJar).builtBy(tasks.named("downloadLayeredSlopes"))
    runtimeOnly files(layeredSlopesJar).builtBy(tasks.named("downloadLayeredSlopes"))

    // Dev/CI-tooling only, and ONLY on the ftfFixture sourceSet's own compileOnly configuration --
    // never main's -- so it never reaches the shipped jar (Wroosbit review 52775). Compiles
    // FreeTerraForgedPresetFixture against FreeTerraForged's real classes; never jarJar'd.
    ftfFixtureCompileOnly files(freeTerraForgedJar).builtBy(tasks.named("downloadFreeTerraForged"))

    testImplementation platform("org.junit:junit-bom:5.11.4")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"

    // Puts FreeTerraForgedPresetFixture's own compiled output and FreeTerraForged's jar on ONLY
    // the ftfPresetData run's classpath, for plain JVM classloading (SmoothSlopesMod's reflective
    // Class.forName lookup) to find -- not NeoForge's own mod-file discovery, which three
    // different prior attempts (sourceSet runtimeOnly, this same additionalRuntimeClasspath
    // mechanism used for mod discovery instead of plain classloading, and overriding the run's
    // primary sourceSet) each failed to get working. See FreeTerraForgedPresetFixture's own class
    // doc for the detailed history.
    add(neoForge.runs.getByName("ftfPresetData").additionalRuntimeClasspathConfiguration.name,
            sourceSets.ftfFixture.output)
    add(neoForge.runs.getByName("ftfPresetData").additionalRuntimeClasspathConfiguration.name,
            files(freeTerraForgedJar).builtBy(tasks.named("downloadFreeTerraForged")))
    // MINECRAFT-500 paired acceptance only: Dynamic Terrain's own independently-built jar, passed
    // in by tools/paired-acceptance/paired_acceptance.py via -PdtJarPath=<path>. Absent for every
    // other invocation (including a plain ./gradlew build), so this is conditional -- the
    // pairedServer run simply has no extra classpath entries when it's absent, never an error.
    if (project.hasProperty('dtJarPath')) {
        add(neoForge.runs.getByName("pairedServer").additionalRuntimeClasspathConfiguration.name,
                files(project.property('dtJarPath')))
    }
}

test {
    useJUnitPlatform()
}

// Expands `${mod_version}` and friends in neoforge.mods.toml to the values
// computed above, so the jar's file name and the version baked into the
// built jar's mods.toml can never drift apart.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : modVersion,
            layeredslopes_version  : layeredSlopesVersion,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
