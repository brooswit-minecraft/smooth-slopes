# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# You can find the latest versions here: https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Environment Properties
# You can find the latest versions here: https://projects.neoforged.net/neoforged/neoforge
# The Minecraft version must agree with the Neo version to get a valid artifact
minecraft_version=1.21.1
# The Minecraft version range can use any release version of Minecraft as bounds.
minecraft_version_range=[1.21.1]
# The Neo version must agree with the Minecraft version to get a valid artifact
neo_version=21.1.250
# The loader version range can only use the major version of FML as bounds
loader_version_range=[1,)

## Mod Properties

# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1,63}
# Must match the String constant located in the main mod class annotated with @Mod.
mod_id=smoothslopes
# The human-readable display name for the mod.
mod_name=Smooth Slopes
# The license of the mod. Review your options at https://choosealicense.com/.
mod_license=MIT
# The group ID for the mod. Matches the base package used for the mod sources,
# mirroring dynamic-atmosphere's io.github.brooswitminecraft group convention.
mod_group_id=io.github.brooswitminecraft

# layered-slopes provides the registered layered-block family this mod places during worldgen
# smoothing. Pinned to the real block-extraction release (MINECRAFT-499,
# brooswit-minecraft/layered-slopes#1, released as v0.2.0), the same release dynamic-terrain itself
# now consumes.
layeredslopes_version=0.2.0
layeredslopes_sha512=a4189fa84d0f99fe4ae0a2d219a7322376e66ea9def5e2ba6a2486e9e616b3bd2853444605c83bb037c7ab336634c1bf896108dfe5b3b8516256c5ff70e336e1

# FreeTerraForged: dev/CI-tooling only, for the MINECRAFT-500 FreeTerraForged acceptance evidence
# (tools/freeterraforged-acceptance/). Pinned to the exact release John staged and verified
# (Jira comment 52703): freeterraforged-1.0.0-neoforge-1.21.1.jar.
freeterraforged_version=1.0.0
freeterraforged_sha512=8e2adfe5a4ad7cbc5478966da63f6027f434dfaec948cee784d5a59715a1207be08cb96b75b808ee42844b765350890ec5fa378db603b93ba92ba2c9ec69251a

# Shipped version placeholder. Read by the release gate; never edited by
# hand in a PR. The real shipped version lives in git tags, computed by the
# release workflow from changelog.d fragments and passed to the build via
# `-Pmod_version=...` -- this file's value is never rewritten.
version=0.0.0
